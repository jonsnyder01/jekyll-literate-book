# Tangles the book naked into the jekyll-literate gem (bin/dist: no
# annotations, which only the book's source browser needs) and checks every
# file it tangles against the published gem (bin/compare).
name: Source

on:
  push:
    branches: [main]
    paths: ["book/**", "gem-static/**", "bin/**", "entangled.toml", ".github/workflows/source.yml"]
  pull_request:
    paths: ["book/**", "gem-static/**", "bin/**", "entangled.toml", ".github/workflows/source.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

env:
  ENTANGLED_VERSION: "2.5.0"

jobs:
  gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The published gem, for bin/compare.
      - uses: actions/checkout@v7
        with:
          repository: jonsnyder01/jekyll-literate
          path: upstream

      # bin/dist and bin/compare are plain Ruby: no gems needed.
      - uses: ruby/setup-ruby@v1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Only one pinned tool is installed; there is no lockfile to cache by.
          enable-cache: false

      - name: Install Entangled
        run: uv tool install "entangled-cli==${ENTANGLED_VERSION}"

      - name: Tangle the gem into dist/
        run: bin/dist

      - name: Compare with jekyll-literate
        run: bin/compare upstream
