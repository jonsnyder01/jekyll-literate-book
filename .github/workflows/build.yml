# Tangles the book into the jekyll-literate gem (bin/dist) and checks every
# file it tangles against the published gem (bin/compare); weaves the book
# with jekyll-literate's reusable workflow, which on main publishes it to
# GitHub Pages.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Let a deploy to Pages finish; a newer push to a PR replaces the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENTANGLED_VERSION: "2.5.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The published gem, for bin/compare.
      - uses: actions/checkout@v7
        with:
          repository: jonsnyder01/jekyll-literate
          path: upstream

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Only one pinned tool is installed; there is no lockfile to cache by.
          enable-cache: false

      - name: Install Entangled
        run: uv tool install "entangled-cli==${ENTANGLED_VERSION}"

      - name: Assemble dist/
        run: bin/dist

      - name: Compare with jekyll-literate
        run: bin/compare upstream

  site:
    uses: jonsnyder01/jekyll-literate/.github/workflows/book.yml@main
    with:
      github-pages: true
    permissions:
      contents: read
      pages: write
      id-token: write
